services:
  - type: web
    name: examloop-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_URL
        value: sqlite:///./backend/examloop.db
      - key: PYTHONPATH
        value: .
      - key: OPENROUTER_API_KEY
        sync: false
